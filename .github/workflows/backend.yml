name: Backend checks

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c backend/constraints.txt -e '.[dev,model]'
      - name: Run API tests
        run: .venv/bin/python -m pytest backend/tests -q
